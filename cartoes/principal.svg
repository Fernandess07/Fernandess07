    @keyframes cresce { to { transform: scaleY(1); } }
    @keyframes brilho { from { transform: translateX(-840px); } to { transform: translateX(840px); } }
    @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
